<svg xmlns="http://www.w3.org/2000/svg" width="520" height="378" viewBox="0 0 520 378" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><style>.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}</style><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F6FF"/></linearGradient></defs><rect x="0.5" y="0.5" width="519" height="377" rx="16" fill="url(#g)" stroke="#D8DEE4"/><rect x="30" y="0.5" width="56" height="3" rx="1.5" fill="#4F46E5"/><rect x="30" y="30" width="48" height="48" rx="12" fill="#4F46E514"/><g transform="translate(42,42) scale(1.0)" fill="none" stroke="#4F46E5" stroke-width="1.80" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></g><text x="94" y="62" font-size="21" font-weight="700" letter-spacing="-0.2" fill="#1F2328">Tax Return Parsing</text><text class="m" x="490" y="60" text-anchor="end" font-size="14" fill="#818B98">01</text><text x="30" y="110" font-size="16" fill="#59636E">Parsers that read VAT, Corporate and Provisional Tax returns</text><text x="30" y="134" font-size="16" fill="#59636E">from PDF and turn them, section by section, into structured data;</text><text x="30" y="158" font-size="16" fill="#59636E">a template design that supports old and new formats side by</text><text x="30" y="182" font-size="16" fill="#59636E">side.</text><line x1="30" y1="210" x2="490" y2="210" stroke="#D8DEE4" stroke-dasharray="3 5"/><text x="30" y="240" font-size="12" font-weight="700" letter-spacing="1.4" fill="#4F46E5">WHAT I LEARNED</text><text x="30" y="264" font-size="15" fill="#1F2328">Broken Turkish character encodings, tables split across pages,</text><text x="30" y="286" font-size="15" fill="#1F2328">re-parsing without corrupting existing data.</text><rect x="30" y="322" width="94.0" height="26" rx="13.0" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="43" cy="335.0" r="3" fill="#4F46E5"/><text x="52.0" y="339.7" font-size="13" fill="#59636E">pdfplumber</text><rect x="131.997" y="322" width="87.3" height="26" rx="13.0" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="144.997" cy="335.0" r="3" fill="#4F46E5"/><text x="154.0" y="339.7" font-size="13" fill="#59636E">PyMuPDF</text><rect x="227.32500000000002" y="322" width="69.3" height="26" rx="13.0" fill="#F6F8FA" stroke="#D8DEE4"/><circle cx="240.32500000000002" cy="335.0" r="3" fill="#4F46E5"/><text x="249.3" y="339.7" font-size="13" fill="#59636E">Django</text></svg>